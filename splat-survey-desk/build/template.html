<title>Splat Survey Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: research workbench. Sticky topic rail on the left, paper ledger on the right; one column on phones. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#141a24; --muted:#5b6678; --line:#dde2ea; --soft:#e9edf3;
  --accent:#2453c9; --accent-ink:#ffffff; --accent-soft:#e3eaff; --good:#1d7a4e; --warn:#a2560b;
  --c-ff:#2453c9; --c-scene:#7a4fc1; --c-surf:#0f7c78; --c-dyn:#c2410c; --c-sparse:#b4237a; --c-fast:#3f7d1c; --c-compact:#a16207; --c-mesh:#475569;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --panel:#161b23; --ink:#e6ebf2; --muted:#98a3b5; --line:#2a313d; --soft:#1e2530;
  --accent:#7ea2ff; --accent-ink:#0b1020; --accent-soft:#1d2a4d; --good:#5fd39a; --warn:#f0a95a;
  --c-ff:#7ea2ff; --c-scene:#b99af0; --c-surf:#4fd1c5; --c-dyn:#fb8c5a; --c-sparse:#f27bbd; --c-fast:#8fd36a; --c-compact:#e8b53c; --c-mesh:#a8b4c6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --panel:#161b23; --ink:#e6ebf2; --muted:#98a3b5; --line:#2a313d; --soft:#1e2530;
  --accent:#7ea2ff; --accent-ink:#0b1020; --accent-soft:#1d2a4d; --good:#5fd39a; --warn:#f0a95a;
  --c-ff:#7ea2ff; --c-scene:#b99af0; --c-surf:#4fd1c5; --c-dyn:#fb8c5a; --c-sparse:#f27bbd; --c-fast:#8fd36a; --c-compact:#e8b53c; --c-mesh:#a8b4c6;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:22px 14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#mark{width:64px;height:44px;flex:none}
.brand h1{font:700 clamp(22px,3.2vw,30px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.stats{margin-left:auto;display:flex;gap:18px;font:12px var(--f-mono);color:var(--muted);flex-wrap:wrap}
.stats b{display:block;font:500 18px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a .n{font:12px var(--f-mono);margin-left:6px;color:var(--muted)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-block:20px 60px}
aside.rail{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:18px}
.lab{font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.topics{display:flex;flex-direction:column;gap:2px}
.topic{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:7px 9px;border-radius:7px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.topic:hover{background:var(--soft)}
.topic[aria-pressed="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.topic .dot{width:10px;height:10px;border-radius:50%}
.topic .ct{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;color:var(--muted)}
select,input[type=search],input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.searchbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.searchbar input{flex:1 1 260px;font-size:15px;padding:10px 12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.meta-line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:4px 0 10px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.p-head{display:flex;gap:12px;align-items:flex-start}
.p-title{font:600 16px/1.35 var(--f-body);margin:0;flex:1;min-width:0;text-wrap:pretty}
.p-title a{color:var(--ink);text-decoration:none}
.p-title a:hover{color:var(--accent);text-decoration:underline}
.star{border:0;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:0 2px}
.star[aria-pressed="true"]{color:var(--warn)}
.p-auth{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:500 11.5px var(--f-body);padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.venue{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip.date{font-family:var(--f-mono);border-color:var(--line);color:var(--muted)}
.chip.new{background:var(--good);border-color:var(--good);color:var(--panel)}
.p-ab{font-size:14px;color:var(--ink);margin:2px 0 0}
.p-ab.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.links a,.links button{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:none;font-weight:500}
.links a:hover,.links button:hover{text-decoration:underline}
.more{display:flex;justify-content:center;padding:14px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.live{margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.live h2,.sec h2{font:700 18px/1.2 var(--f-display);margin:0}
.live p{margin:0;color:var(--muted);font-size:14px;max-width:75ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font:12.5px var(--f-mono);color:var(--muted)}
.status.err{color:var(--warn)}
.venuebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.vbtn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:13px}
.vbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vbtn .ct{font:11.5px var(--f-mono);opacity:.7;margin-left:4px}
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.extgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ext{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-decoration:none;color:var(--ink)}
.ext:hover{border-color:var(--accent)}
.ext small{color:var(--muted);font-size:12px}
table.found{width:100%;border-collapse:collapse;font-size:14px}
.tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table.found th,table.found td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.found th{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
table.found td.yr{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
table.found td.vn{white-space:nowrap;font-weight:500}
.note{font-size:13px;color:var(--muted);max-width:80ch}
.lhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lnum{font:500 12px var(--f-mono);color:var(--accent);letter-spacing:.04em}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.litem{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.litem.isdone{opacity:.62}
.litem.isdone .ltitle{text-decoration:line-through}
.ldone input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.ltitle{font-weight:600;text-decoration:none}
.ltitle:hover{text-decoration:underline}
.lwhy{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.chip.lvl-beginner{color:var(--good)}
.chip.lvl-intermediate{color:var(--accent)}
.chip.lvl-advanced{color:var(--warn)}
.lprog{display:flex;gap:12px;align-items:center}
.lbar{flex:1;max-width:320px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.lbar span{display:block;height:100%;background:var(--accent)}
@media (max-width:860px){.lgrid{grid-template-columns:minmax(0,1fr)}}
.p-title button{all:unset;cursor:pointer;color:var(--ink)}
.p-title button:hover{color:var(--accent);text-decoration:underline}
.p-title button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.paper{cursor:pointer}
.paper:hover{border-color:var(--accent)}
.dv-scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:30}
.dv{position:fixed;top:0;right:0;bottom:0;width:min(880px,100%);background:var(--bg);z-index:31;overflow-y:auto;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dv-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.dv-body{display:flex;flex-direction:column;gap:12px;padding-block:18px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.dv-title{font:700 clamp(19px,2.6vw,24px)/1.25 var(--f-display);margin:0;text-wrap:balance}
.dv-abs summary{cursor:pointer;font-weight:600;color:var(--accent)}
.dv-abs p{font-size:14px;max-width:80ch}
.x-wait{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.x-wait>div:nth-child(2){flex:1;min-width:0}
.x-spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--accent);animation:spin 0.9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.x-note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.x-sec{display:flex;flex-direction:column;gap:6px;min-width:0}
.x-sec h3{font:600 11.5px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.x-sec p,.x-sec li{font-size:14.5px;max-width:78ch;margin:0}
.x-sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.x-tldr{font:500 17px/1.45 var(--f-body)!important;border-left:3px solid var(--accent);padding-left:12px}
.x-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.x-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.lg{display:inline-block;width:14px;height:10px;border-radius:3px;border:1.5px solid var(--line);background:var(--panel)}
.lg.k-input{border-color:var(--c-surf)} .lg.k-module{border-color:var(--accent)} .lg.k-representation{border-color:var(--c-scene)} .lg.k-loss{border-color:var(--c-dyn)} .lg.k-output{border-color:var(--good)}
.lg.dash{border-style:dashed;border-color:var(--muted)} .lg.fb{border:0;border-top:2px dashed var(--c-dyn);border-radius:0;height:0} .lg.infr{background:var(--soft);border-color:var(--muted);opacity:.7}
.flowbox{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
.flow{display:block;margin:0 auto;max-width:none}
.flow .fe{fill:none;stroke:var(--muted);stroke-width:1.6}
.flow .be{fill:none;stroke:var(--c-dyn);stroke-width:1.6;stroke-dasharray:5 4}
.flow .ahp{fill:var(--muted)} .flow .ahb{fill:var(--c-dyn)}
.flow .el rect{fill:var(--panel);stroke:var(--line)} .flow .el text{fill:var(--muted);font:11px var(--f-mono)}
.flow .nd{cursor:pointer}
.flow .nd rect{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.flow .nd .band{stroke:none}
.flow .nd.k-input .band{fill:var(--c-surf)} .flow .nd.k-module .band{fill:var(--accent)} .flow .nd.k-representation .band{fill:var(--c-scene)} .flow .nd.k-loss .band{fill:var(--c-dyn)} .flow .nd.k-output .band{fill:var(--good)}
.flow .nd.k-input rect:first-child{stroke:var(--c-surf)} .flow .nd.k-module rect:first-child{stroke:var(--accent)} .flow .nd.k-representation rect:first-child{stroke:var(--c-scene)} .flow .nd.k-loss rect:first-child{stroke:var(--c-dyn)} .flow .nd.k-output rect:first-child{stroke:var(--good)}
.flow .nd.ph-train rect:first-child{stroke-dasharray:6 4}
.flow .nd.inf rect:first-child{fill:var(--soft)}
.flow .nd.sel rect:first-child,.flow .nd:hover rect:first-child,.flow .nd:focus rect:first-child{stroke-width:3}
.flow .nd:focus{outline:none}
.flow .nk{fill:var(--muted);font:10.5px var(--f-mono)}
.flow .nl{fill:var(--ink);font:600 13.5px var(--f-body)}
.x-nodeinfo{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.x-nodeinfo p{margin:4px 0 0}
.x-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.x-steps p{margin:2px 0 0;color:var(--muted)}
@media (max-width:640px){.x-two{grid-template-columns:minmax(0,1fr)}}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.links button[data-cmp][aria-pressed="true"]{color:var(--good)}
.ctray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:12px;padding:10px 12px 10px 16px;max-width:calc(100% - 32px)}
.ctray .btn.disabled{opacity:.5;pointer-events:none}
body.has-tray .layout{padding-bottom:110px}
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-top:16px}
.cmp{min-width:max-content}
.cr{display:grid;border-bottom:1px solid var(--line)}
.cr:last-child{border-bottom:0}
.ch{position:sticky;left:0;background:var(--soft);font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px;z-index:1}
.cc{padding:12px 14px;font-size:14px;border-left:1px solid var(--line);min-width:0;max-width:360px}
.cc ul,.cc ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.cr.chead{position:sticky;top:0;z-index:2;background:var(--panel)}
.cr.chead .cc{background:var(--panel)}
.cr.cdim .cc{background:var(--accent-soft)}
.cr.cdim .ch{color:var(--accent)}
.cr.cexp .ch{color:var(--good)}
.cp-num{font:500 12px var(--f-mono);color:var(--accent)}
.cp-t{all:unset;cursor:pointer;font-weight:600;font-size:15px;line-height:1.35;color:var(--ink)}
.cp-t:hover{color:var(--accent);text-decoration:underline}

.cnone{color:var(--muted);font-style:italic;font-size:13px}

.csteps{font-size:13px;color:var(--muted)}
.cab{font-size:13px;color:var(--muted)}
.cmp-sum{display:flex;flex-direction:column;gap:12px;margin-top:16px}

[hidden]{display:none!important}

.bs-paper{color:var(--good)} .bs-abstract{color:var(--accent)} .bs-recalled{color:var(--warn)} .bs-ns{color:var(--muted)}

.bdn{font:500 12.5px var(--f-mono);color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding-top:2px}

.bmeta a{text-decoration:none;font-weight:500}
.bk{font:600 10.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--good);margin-right:4px}

<div class="wrap">
  <header class="top">
    <canvas id="mark" width="128" height="88" aria-hidden="true"></canvas>
    <div class="brand">
      <h1>Splat Survey Desk</h1>
      <p>Gaussian splatting literature for your survey: newest arXiv preprints, accepted conference papers, and the geometry &amp; vision classics behind them.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#latest" data-v="latest">Latest arXiv</a>
    <a href="#venues" data-v="venues">Accepted at venues</a>
    <a href="#foundations" data-v="foundations">Classic papers</a>
    <a href="#search-out" data-v="search-out">Search conferences</a>
    <a href="#compare" data-v="compare">Compare<span class="n" id="cn">0</span></a>
    <a href="#learn" data-v="learn">Learn</a>
    <a href="#reading" data-v="reading">Reading list<span class="n" id="rn">0</span></a>
  </nav>
  <div class="layout">
    <aside class="rail">
      <div>
        <p class="lab">Survey topics</p>
        <div class="topics" id="topics"></div>
      </div>
      <div class="filters">
        <p class="lab">Filters</p>
        <div class="field"><label for="f-year">Year</label><select id="f-year"></select></div>
        <div class="field"><label for="f-sort">Sort</label>
          <select id="f-sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="title">Title A–Z</option></select></div>
        <label class="check"><input type="checkbox" id="f-code"> Has code</label>
        <label class="check"><input type="checkbox" id="f-acc"> Accepted papers only</label>
      </div>
      <p class="note" id="srcnote"></p>
    </aside>
    <main id="main" style="min-width:0"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="application/json" id="papers">__DATA__</script>
<script>
(function(){
const ORIGINAL_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;
const SNAPSHOT = '__SNAPSHOT__';
const DESK = window.DESK || {};
try{ if(window.self!==window.top) document.body.classList.add('embedded'); }catch(e){ document.body.classList.add('embedded'); }
const SP = DESK.storePrefix || 'ssd-';
const DSUB = DESK.surveyDesc || 'a survey on 3D Gaussian splatting (feed-forward 3DGS, scene-specific 3DGS, surface reconstruction, 4D/dynamic reconstruction, sparse-view 3DGS, real-time / fast-training 3DGS, Gaussian compaction, meshes + Gaussians)';
const P = JSON.parse(document.getElementById('papers').textContent);
const BYID = new Map(P.map(p=>[p.i,p]));

const TOPICS = DESK.topics || [
  {k:'ff',     n:'Feed-forward 3DGS',          q:'"gaussian splatting" AND (feed-forward OR generalizable OR "pose-free")'},
  {k:'scene',  n:'Scene-specific 3DGS',         q:'"gaussian splatting" AND ("novel view synthesis" OR densification OR "per-scene")'},
  {k:'surf',   n:'Surface reconstruction',      q:'"gaussian splatting" AND ("surface reconstruction" OR SDF OR geometry)'},
  {k:'dyn',    n:'4D / dynamic reconstruction', q:'"gaussian splatting" AND (4D OR dynamic OR deformable)'},
  {k:'sparse', n:'Sparse-view 3DGS',            q:'"gaussian splatting" AND ("sparse view" OR "few-shot" OR "sparse-view")'},
  {k:'fast',   n:'Real-time / fast training',   q:'"gaussian splatting" AND ("fast training" OR accelerat* OR "training time")'},
  {k:'compact',n:'Gaussian compaction',         q:'"gaussian splatting" AND (compact OR compression OR pruning)'},
  {k:'mesh',   n:'Meshes + Gaussians',          q:'"gaussian splatting" AND (mesh OR meshes)'}
];
const TN = Object.fromEntries(TOPICS.map(t=>[t.k,t.n]));
const arxivQ = DESK.arxivQ || {
  all:'abs:"gaussian splatting"',
  ff:'abs:"gaussian splatting" AND (abs:"feed-forward" OR abs:generalizable OR abs:"pose-free")',
  scene:'abs:"gaussian splatting" AND (abs:"novel view synthesis" OR abs:densification)',
  surf:'abs:"gaussian splatting" AND (abs:"surface reconstruction" OR abs:SDF OR abs:"geometric")',
  dyn:'abs:"gaussian splatting" AND (abs:4D OR abs:dynamic OR abs:deformable)',
  sparse:'abs:"gaussian splatting" AND (abs:"sparse view" OR abs:"sparse-view" OR abs:"few-shot")',
  fast:'abs:"gaussian splatting" AND (abs:"fast training" OR abs:"training time" OR abs:accelerate)',
  compact:'abs:"gaussian splatting" AND (abs:compact OR abs:compression OR abs:pruning)',
  mesh:'abs:"gaussian splatting" AND (abs:mesh OR abs:meshes)'
};
const plainQ = DESK.plainQ || {all:'gaussian splatting', ff:'feed-forward gaussian splatting', scene:'3D gaussian splatting novel view synthesis', surf:'gaussian splatting surface reconstruction', dyn:'4D gaussian splatting dynamic', sparse:'sparse view gaussian splatting', fast:'fast training gaussian splatting', compact:'compact gaussian splatting compression', mesh:'mesh gaussian splatting'};

// ---------- state
const st = {view:'latest', topic:'all', q:'', year:'all', sort:'new', code:false, acc:false, venue:'all', shown:40, live:null};
let reading = new Set();
try{ reading = new Set(JSON.parse(localStorage.getItem(SP+'reading')||'[]')); }catch(e){}
try{ const s = JSON.parse(localStorage.getItem(SP+'ui')||'{}'); if(s.topic) st.topic=s.topic; }catch(e){}
function saveRL(){ try{localStorage.setItem(SP+'reading', JSON.stringify([...reading]));}catch(e){} document.getElementById('rn').textContent=reading.size; }
function saveUI(){ try{localStorage.setItem(SP+'ui', JSON.stringify({topic:st.topic}));}catch(e){} }

const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }

// ---------- brand mark: anisotropic gaussians
(function(){ const c=$('#mark'), g=c.getContext('2d'); const cs=getComputedStyle(document.documentElement);
  const cols=['--c-ff','--c-dyn','--c-surf','--c-scene','--c-compact'].map(v=>cs.getPropertyValue(v).trim());
  const bl=[[40,46,30,12,.5],[70,36,22,9,-.6],[88,58,26,10,.3],[58,62,16,7,1.2],[30,28,12,6,-.3]];
  bl.forEach((b,i)=>{ g.save(); g.translate(b[0],b[1]); g.rotate(b[4]); g.scale(b[2],b[3]);
    const r=g.createRadialGradient(0,0,0,0,0,1); r.addColorStop(0,cols[i]); r.addColorStop(1,'transparent');
    g.globalAlpha=.85; g.fillStyle=r; g.beginPath(); g.arc(0,0,1,0,7); g.fill(); g.restore(); });
})();

// ---------- filters
const years = [...new Set(P.map(p=>p.d.slice(0,4)))].sort().reverse();
$('#f-year').innerHTML = '<option value="all">All years</option>'+years.map(y=>`<option>${y}</option>`).join('');
function base(list){
  const q = st.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  let r = list.filter(p=>{
    if(st.topic!=='all' && !p.k.includes(st.topic)) return false;
    if(st.year!=='all' && p.d.slice(0,4)!==st.year) return false;
    if(st.code && !p.c) return false;
    if(st.acc && !p.v.length) return false;
    if(terms.length){ const h=(p.t+' '+p.a+' '+p.ab+' '+p.v.join(' ')+' '+p.i).toLowerCase(); if(!terms.every(t=>h.includes(t))) return false; }
    return true;
  });
  if(st.sort==='old') r = r.slice().reverse();
  if(st.sort==='title') r = r.slice().sort((a,b)=>a.t.localeCompare(b.t));
  return r;
}
function renderTopics(){
  const pool = P.filter(p=>(st.view!=='venues'||p.v.length));
  const cnt = k=>k==='all'?pool.length:pool.filter(p=>p.k.includes(k)).length;
  $('#topics').innerHTML = [{k:'all',n:DESK.allLabel||'All Gaussian splatting'}].concat(TOPICS).map(t=>
    `<button class="topic" data-k="${t.k}" aria-pressed="${st.topic===t.k}"><span class="dot" style="background:${t.k==='all'?'var(--ink)':'var(--c-'+t.k+')'}"></span><span>${esc(t.n)}</span><span class="ct">${cnt(t.k)}</span></button>`).join('');
}
$('#topics').addEventListener('click',e=>{ const b=e.target.closest('.topic'); if(!b) return; st.topic=b.dataset.k; st.shown=40; st.live=null; saveUI(); render(); });
['f-year','f-sort'].forEach(id=>$('#'+id).addEventListener('change',e=>{ st[id.slice(2)]=e.target.value; st.shown=40; render(); }));
$('#f-code').addEventListener('change',e=>{st.code=e.target.checked; st.shown=40; render();});
$('#f-acc').addEventListener('change',e=>{st.acc=e.target.checked; st.shown=40; render();});

// ---------- paper card
let latestD = P.length?P[0].d:'—';
function card(p, opts={}){
  const isNew = latestD!=='—' && p.d >= addDays(latestD,-45);
  const tchips = p.k.map(k=>`<span class="chip" style="color:var(--c-${k})">${esc(TN[k])}</span>`).join('');
  const v = p.v.map(x=>`<span class="chip venue">${esc(x)}</span>`).join('');
  const id = p.i;
  const abs = p.ab ? `<p class="p-ab clamp">${esc(p.ab)}</p>` : '';
  return `<article class="paper" data-id="${esc(id)}">
    <div class="p-head"><h3 class="p-title"><button data-open="${esc(id)}" title="Open summary and method diagram">${esc(p.t)}</button></h3>
      ${opts.nostar?'':`<button class="star" data-star="${esc(id)}" aria-pressed="${reading.has(id)}" title="Add to reading list" aria-label="Add to reading list">${reading.has(id)?'★':'☆'}</button>`}</div>
    <div class="p-auth">${esc(p.a)}${p.org?` · <span>${esc(p.org)}</span>`:''}</div>
    <div class="chips">${v}<span class="chip date">${esc(p.d)} · arXiv ${esc(id)}</span>${p.fresh&&!DESK.noLiveChip?'<span class="chip new">Live</span>':isNew&&!opts.live?'<span class="chip new">New</span>':''}${tchips}</div>
    ${abs}
    <div class="links">
      ${p.ab?'<button data-expand>Abstract</button>':''}
      <button data-open="${esc(id)}">Summary + diagram</button>
      <button data-cmp="${esc(id)}" aria-pressed="${cmp.includes(id)}">${cmp.includes(id)?'✓ Comparing':'+ Compare'}</button>
      <a href="https://arxiv.org/abs/${esc(id)}" target="_blank" rel="noopener">arXiv</a>
      <a href="https://arxiv.org/pdf/${esc(id)}" target="_blank" rel="noopener">PDF</a>
      ${p.c?`<a href="${esc(p.c)}" target="_blank" rel="noopener">Code</a>`:''}
      ${p.pp?`<a href="${esc(p.pp)}" target="_blank" rel="noopener">Project page</a>`:''}
      <a href="https://www.semanticscholar.org/arxiv/${esc(id)}" target="_blank" rel="noopener">Citations</a>
      <a href="https://scholar.google.com/scholar?q=${encodeURIComponent('"'+p.t+'"')}" target="_blank" rel="noopener">Scholar</a>
      <button data-bib="${esc(id)}">Copy BibTeX</button>
    </div></article>`;
}
function addDays(d,n){ const x=new Date((d.length===7?d+'-01':d)+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function bib(p){
  const first=(p.a||'anon').split(',')[0].trim().split(/\s+/).pop().replace(/[^A-Za-z]/g,'').toLowerCase()||'anon';
  const w=(p.t.match(/[A-Za-z]{4,}/)||['paper'])[0].toLowerCase();
  const authors=(p.a||'').replace(/ et\.? ?al\.?/,' and others').split(/,\s*/).join(' and ');
  const venue=p.v[0]?`,\n  note = {${p.v.join('; ')}}`:'';
  return `@article{${first}${p.d.slice(0,4)}${w},\n  title = {${p.t}},\n  author = {${authors}},\n  journal = {arXiv preprint arXiv:${p.i}},\n  year = {${p.d.slice(0,4)}}${venue}\n}`;
}
async function copy(text, msg){
  try{ await navigator.clipboard.writeText(text); toast(msg||'Copied'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast(msg||'Copied');}catch(_){toast('Select the text and copy it manually');} ta.remove(); }
}
$('#main').addEventListener('click',e=>{
  const op=e.target.closest('[data-open]'); if(op){ openPaper(op.dataset.open); return; }
  const cb=e.target.closest('[data-cmp]'); if(cb){ toggleCmp(cb.dataset.cmp); return; }
  const s=e.target.closest('[data-star]');
  if(s){ const id=s.dataset.star; reading.has(id)?reading.delete(id):reading.add(id); saveRL(); s.setAttribute('aria-pressed',reading.has(id)); s.textContent=reading.has(id)?'★':'☆'; toast(reading.has(id)?'Added to reading list':'Removed from reading list'); if(st.view==='reading') render(); return; }
  const x=e.target.closest('[data-expand]');
  if(x){ const ab=x.closest('.paper').querySelector('.p-ab'); const c=ab.classList.toggle('clamp'); x.textContent=c?'Abstract':'Hide abstract'; return; }
  const b=e.target.closest('[data-bib]');
  if(b){ const p=BYID.get(b.dataset.bib)||(st.live||[]).find(q=>q.i===b.dataset.bib); if(p) copy(bib(p),'BibTeX copied'); return; }
  const m=e.target.closest('[data-more]'); if(m){ st.shown+=60; render(); return; }
  const v=e.target.closest('.vbtn'); if(v){ st.venue=v.dataset.v; st.shown=40; render(); return; }
  const art=e.target.closest('.paper'); if(art && !e.target.closest('a,button,input,label,summary') && !getSelection().toString()) openPaper(art.dataset.id);
});
function listHTML(list){
  if(!list.length) return `<div class="empty">No papers match these filters. Clear the search box or pick another topic.</div>`;
  return `<div class="list">${list.slice(0,st.shown).map(p=>card(p)).join('')}</div>`+
    (list.length>st.shown?`<div class="more"><button class="btn" data-more>Show ${Math.min(60,list.length-st.shown)} more of ${list.length-st.shown} remaining</button></div>`:'');
}
function searchBar(ph){
  return `<div class="searchbar"><input type="search" id="q" placeholder="${ph}" value="${esc(st.q)}" aria-label="Search papers"></div>`;
}
function bindSearch(){ const q=$('#q'); if(!q) return; q.addEventListener('input',()=>{ st.q=q.value; st.shown=40; clearTimeout(bindSearch.t); bindSearch.t=setTimeout(()=>renderList(),120); }); }

// ---------- live arXiv
function topicKey(){ return st.topic; }
function arxivSiteURL(k){ return 'https://arxiv.org/search/?query='+encodeURIComponent(plainQ[k])+'&searchtype=all&abstracts=show&order=-announced_date_first&size=50'; }
// ---------- optional Apps Script backend (set window.SSD_BACKEND_URL); proxies the arXiv API
const BACKEND_URL=(window.SSD_BACKEND_URL||'').trim();
const TOPRX=DESK.topicRx?Object.fromEntries(Object.entries(DESK.topicRx).map(([k,s])=>[k,new RegExp(s,'gi')])):{
 ff:/feed[- ]?forward|generali[sz]able|pixelsplat|mvsplat|pose[- ]free|unposed|single[- ]image to 3d|image-to-3d|large reconstruction model|\bLRM\b|one forward pass|single forward|zero-shot (3d|reconstruction)|amortized/gi,
 scene:/per-scene|scene[- ]specific|novel view synthesis|densification|anti-?alias|view-dependent|reflect|specular|unbounded|large-scale|in the wild|city|aerial|rendering quality|floaters/gi,
 surf:/surface reconstruction|\bsdf\b|signed distance|2dgs|2d gaussian|geometr(y|ic) (accura|reconstruct|fidelity)|normal (prior|estimation|consisten)|planar|surfel|depth[- ]normal|watertight|neus|chamfer/gi,
 dyn:/\b4d\b|4dgs|dynamic|deformable|deformation field|temporal|monocular video|motion|time-varying|non-rigid|free[- ]viewpoint video|volumetric video/gi,
 sparse:/sparse[- ]view|few[- ]shot|few[- ]view|sparse input|limited views|two views|three views|\b3 views|sparse images|sparse observations/gi,
 fast:/real[- ]time|fast training|training time|accelerat|speed[- ]?up|faster|in (seconds|minutes)|\d+ ?(seconds|minutes)|efficient training|rapid|instant|\bfps\b|lightweight/gi,
 compact:/compact|compress|prun|storage|memory (footprint|efficient|consumption)|quantiz|codebook|\bmb\b|bitrate|rate-distortion|lightweight|fewer gaussians|number of gaussians|entropy|distill/gi,
 mesh:/\bmesh|meshes|meshing|marching cubes|tetrahedr|triangle|mesh extraction|mesh-based|polygon|texture[d ]? mesh/gi
};
function classify(title,ab){ const txt=title+' '+ab; return Object.keys(TOPRX).filter(k=>{ const r=TOPRX[k]; r.lastIndex=0; const inTitle=new RegExp(r.source,'i').test(title); const hits=(txt.match(r)||[]).length; return inTitle||hits>=2; }); }
const VENRX=/\b(CVPR|ICCV|ECCV|NeurIPS|ICLR|ICML|SIGGRAPH Asia|SIGGRAPH|3DV|AAAI|TPAMI|WACV|BMVC|ICRA|IROS|TVCG|TOG|Eurographics|CoRL|RSS|ICASSP|INTERSPEECH|Interspeech|DCASE|WASPAA|EUSIPCO|ISMIR|TASLP|IEEE SPL|ACM MM|IJCAI|ACL|EMNLP)\s*'?(20\d\d)\b/g;
async function backendArxiv(query,max,start){
  const url=BACKEND_URL+'?data='+encodeURIComponent(JSON.stringify({action:'arxiv',query,max,start:start||0}));
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),30000);
  const r=await fetch(url,{signal:ctl.signal}); clearTimeout(to);
  const j=await r.json(); if(!j.success) throw new Error(j.message||'backend error');
  return j.papers.map(x=>({i:x.i,t:x.t,a:x.a,d:x.d,ab:x.ab,c:x.c||undefined,k:classify(x.t,x.ab),v:[...new Set([...(x.cm+' '+x.ab).matchAll(VENRX)].map(m=>m[1]+' '+m[2]))],g:[],fresh:true}));
}
let FRESH=null;
async function loadFresh(){
  if(!BACKEND_URL) return;
  let items=null;
  try{ const c=JSON.parse(localStorage.getItem(SP+'fresh')||'null'); if(c&&Date.now()-c.at<6*3600e3) items=c.items; }catch(e){}
  if(!items){ try{ items=[]; const pages=DESK.freshPages||1; for(let pg=0;pg<pages;pg++){ const el=$('#freshnote'); if(el&&pages>1){ el.hidden=false; el.textContent=`Loading papers from arXiv through your backend… ${items.length} so far`; } const got=await backendArxiv(arxivQ.all,200,pg*200); items.push(...got); if(got.length<200) break; if(pg<pages-1) await new Promise(r=>setTimeout(r,3200)); } try{localStorage.setItem(SP+'fresh',JSON.stringify({at:Date.now(),items}));}catch(e){} }catch(e){ FRESH={err:true}; renderFreshNote(); return; } }
  const add=items.filter(p=>p.i&&!BYID.has(p.i));
  add.forEach(p=>BYID.set(p.i,p));
  P.unshift(...add); P.sort((a,b)=>(b.d.slice(0,10)).localeCompare(a.d.slice(0,10))||b.i.localeCompare(a.i));
  latestD=P.length?P[0].d:'—'; FRESH={n:add.length};
  const ys=[...new Set(P.map(p=>p.d.slice(0,4)))].sort().reverse(); $('#f-year').innerHTML='<option value="all">All years</option>'+ys.map(y=>`<option${y===st.year?' selected':''}>${y}</option>`).join('');
  document.querySelector('#stats b').textContent=P.length.toLocaleString();
  document.querySelectorAll('#stats b')[2].textContent=latestD;
  document.querySelectorAll('#stats b')[1].textContent=P.filter(p=>p.v.length).length.toLocaleString();
  if(['latest','venues','reading'].includes(st.view)) render(); else renderFreshNote();
}
function renderFreshNote(){ const el=$('#freshnote'); if(!el||!FRESH) return; el.hidden=false;
  el.textContent=FRESH.err?(P.length?'Could not reach your backend for newer arXiv papers; showing the snapshot only.':'Could not reach your backend, so no papers could be loaded. Check that the diary backend has the arxiv action deployed.'):(FRESH.n?(DESK.noLiveChip?`Loaded ${FRESH.n} paper${FRESH.n>1?'s':''} from arXiv through your backend.`:`Added ${FRESH.n} newer paper${FRESH.n>1?'s':''} from arXiv through your backend. They are marked “Live”.`):'Checked arXiv through your backend: the snapshot is up to date.'); }
async function fetchLive(){
  const k=topicKey(); const s=$('#livestatus'); s.className='status'; s.textContent='Asking arXiv for the 50 newest papers…';
  if(BACKEND_URL){ try{ const items=await backendArxiv(arxivQ[k],50); return finishLive(items,'arXiv (through your backend)'); }catch(e){} }
  try{
    const url='https://export.arxiv.org/api/query?search_query='+encodeURIComponent(arxivQ[k])+'&sortBy=submittedDate&sortOrder=descending&max_results=50';
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),15000);
    const r=await fetch(url,{signal:ctl.signal}); clearTimeout(to);
    if(!r.ok) throw new Error('arXiv answered '+r.status);
    const x=new DOMParser().parseFromString(await r.text(),'application/xml');
    const items=[...x.getElementsByTagName('entry')].map(e=>{
      const g=t=>(e.getElementsByTagName(t)[0]?.textContent||'').replace(/\s+/g,' ').trim();
      const id=g('id').replace(/^.*abs\//,'').replace(/v\d+$/,'');
      const com=g('arxiv:comment');
      const ven=[...(g('summary')+' '+com).matchAll(/\b(CVPR|ICCV|ECCV|NeurIPS|ICLR|SIGGRAPH Asia|SIGGRAPH|3DV|AAAI|TPAMI|WACV|BMVC|ICRA|IROS|TVCG|TOG)\s*'?(20\d\d)\b/g)].map(m=>m[1]+' '+m[2]);
      return {i:id,t:g('title'),a:[...e.getElementsByTagName('author')].map(a=>a.textContent.trim()).join(', '),d:g('published').slice(0,10),ab:g('summary'),k:k==='all'?[]:[k],v:[...new Set(ven)],g:[]};
    });
    return finishLive(items, 'arXiv API');
  }catch(err){
    try{
      const url='https://api.openalex.org/works?search='+encodeURIComponent(plainQ[k])+'&sort=publication_date:desc&per_page=50&filter=from_publication_date:'+addDays(new Date().toISOString().slice(0,10),-120);
      const r=await fetch(url); if(!r.ok) throw new Error('OpenAlex '+r.status);
      const j=await r.json();
      const items=j.results.map(w=>{ const ax=(JSON.stringify(w.ids||{})+JSON.stringify(w.locations||[])).match(/(\d{4}\.\d{4,5})/);

// layered DAG layout (top to bottom)
function layout(o){
  const S=o.stages, idx=new Map(S.map((s,i)=>[s.id,i]));
  const out=new Map(S.map(s=>[s.id,[]])), inn=new Map(S.map(s=>[s.id,[]]));
  // find back edges with DFS so loops (e.g. densification feedback) don't break layering
  const state={}, back=new Set();
  o.edges.forEach(e=>out.get(e.from).push(e));
  const dfs=u=>{ state[u]=1; for(const e of out.get(u)){ if(state[e.to]===1) back.add(e); else if(!state[e.to]) dfs(e.to); } state[u]=2; };
  S.forEach(s=>{ if(!state[s.id]) dfs(s.id); });
  const fwd=o.edges.filter(e=>!back.has(e));
  fwd.forEach(e=>inn.get(e.to).push(e));
  const L={}; const lv=id=>{ if(L[id]!=null) return L[id]; L[id]=0; let m=0; for(const e of inn.get(id)) m=Math.max(m,lv(e.from)+1); return L[id]=m; };
  S.forEach(s=>lv(s.id));
  const layers=[]; S.forEach(s=>{ (layers[L[s.id]] ||= []).push(s); });
  for(let i=1;i<layers.length;i++){ const prevPos=new Map(layers[i-1].map((s,j)=>[s.id,j]));
    layers[i].sort((a,b)=>{ const bc=n=>{ const ps=inn.get(n.id).map(e=>prevPos.get(e.from)).filter(x=>x!=null); return ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:idx.get(n.id); }; return bc(a)-bc(b); }); }
  const W=196, GX=28, GY=58, PAD=24;
  const wrap=(t,n)=>{ const w=t.split(/\s+/), lines=[]; let c=''; for(const x of w){ if((c+' '+x).trim().length>n){ if(c) lines.push(c); c=x; } else c=(c+' '+x).trim(); } if(c) lines.push(c); return lines.slice(0,3); };
  const maxCols=Math.max(...layers.map(l=>l.length));
  const width=Math.max(maxCols*(W+GX)-GX+PAD*2, 420);
  const pos={}; let y=PAD;
  layers.forEach(l=>{ let h=0; l.forEach(s=>{ s._lines=wrap(s.label,22); s._h=30+s._lines.length*17; h=Math.max(h,s._h); });
    const rowW=l.length*(W+GX)-GX; let x=(width-rowW)/2;
    l.forEach(s=>{ pos[s.id]={x,y:y+(h-s._h)/2,w:W,h:s._h}; x+=W+GX; }); y+=h+GY; });
  const bw=back.size?Math.max(...[...back].map(e=>e.label.length*3.1+5))+22+back.size*16:0;
  return {pos,width:width+bw,height:y-GY+PAD,back,fwd};
}

async function usePdf(p,file){

    const n=Math.min(doc.numPages,40); let out='';
    for(let i=1;i<=n;i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); out+=`\n[page ${i}]\n`+tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join(''); st.textContent=`Reading page ${i} of ${n}…`; if(out.length>140000) break; }

function diagramSVG(o){

    edges+=`<path class="fe" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" marker-end="url(#ah)"/>`;
    if(e.label){ const lx=(x1+x2)/2, ly=my; const tw=e.label.length*6.1+10; labels+=`<g class="el"><rect x="${lx-tw/2}" y="${ly-9}" width="${tw}" height="17" rx="4"/><text x="${lx}" y="${ly+3.5}" text-anchor="middle">${esc(e.label)}</text></g>`; } });
  let bi=0; const right=Math.max(...Object.values(pos).map(q=>q.x+q.w));
  back.forEach(e=>{ const a=pos[e.from], b=pos[e.to]; const xr=right+22+bi*16; bi++;
    const y1=a.y+a.h/2+4, y2=b.y+b.h/2-4, r=8;
    edges+=`<path class="be" d="M${a.x+a.w},${y1} H${xr-r} Q${xr},${y1} ${xr},${y1-r} V${y2+r} Q${xr},${y2} ${xr-r},${y2} H${b.x+b.w+7}" marker-end="url(#ahb)"/>`;
    if(e.label){ const tw=e.label.length*6.1+10; const ly=(y1+y2)/2; labels+=`<g class="el"><rect x="${xr-tw/2}" y="${ly-9}" width="${tw}" height="17" rx="4"/><text x="${xr}" y="${ly+3.5}" text-anchor="middle">${esc(e.label)}</text></g>`; } });
  const nodes=o.stages.map((s,i)=>{ const p=pos[s.id];
    return `<g class="nd k-${s.kind}${s.phase==='train'?' ph-train':''}${s.basis==='inferred'?' inf':''}" data-node="${esc(s.id)}" tabindex="0" role="button" aria-label="${esc(s.label)}">
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8"/>
      <rect class="band" x="${p.x}" y="${p.y}" width="5" height="${p.h}" rx="2"/>
      <text class="nk" x="${p.x+14}" y="${p.y+16}">${i+1} · ${esc(KSHORT[s.kind])}${s.phase==='train'?' · train':s.phase==='infer'?' · test':''}</text>
      ${s._lines.map((l,j)=>`<text class="nl" x="${p.x+14}" y="${p.y+34+j*17}">${esc(l)}</text>`).join('')}
    </g>`; }).join('');
  return `<svg class="flow" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="Method block diagram">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahp" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahb" d="M0,0 L10,5 L0,10 z"/></marker></defs>
    ${edges}${nodes}${labels}</svg>`;
}
function mermaid(o){
  const q=s=>'"'+s.replace(/"/g,"'")+'"';

  return 'flowchart TD\n'+o.stages.map(s=>`  ${s.id}${shape[s.kind][0]}${q(s.label)}${shape[s.kind][1]}`).join('\n')+'\n'+
    o.edges.map(e=>`  ${e.from} -->${e.label?'|'+q(e.label)+'|':''} ${e.to}`).join('\n');
}

function cmpKey(){ return SP+'cmpx-'+XVER+'-'+cmp.slice().sort().join('|'); }
function cmpGet(){ try{ const v=localStorage.getItem(cmpKey()); return v?JSON.parse(v):null; }catch(e){ return null; } }
function cmpPut(o){ try{ localStorage.setItem(cmpKey(),JSON.stringify(o)); }catch(e){} }
const XERR={cancelled:'Stopped.',not_granted:'Claude was not allowed for this page. You can allow it from the page’s permissions menu and try again.',rate_limited:'Too many requests at once. Wait a minute and try again.',sampling_disabled:'Claude is not available for this account.',invalid_json:'The answer came back in an unexpected format. Try again.',refused:'Claude declined this request.'};
async function getSample(){ if(!window.claude) return null; try{ return await claude.use('sample'); }catch(e){ return null; } }

async function explainMissing(){
  const sample=await getSample();
  if(!sample){ cmpState.msg='Claude is only available when this page is opened on claude.ai.'; render(); return; }
  const todo=cmp.map(findPaper).filter(p=>p&&!xget(p.i));
  cmpState.busy=true; cmpState.ctl=new AbortController(); cmpState.msg='';
  try{
    for(let k=0;k<todo.length;k++){
      const p=todo[k]; cmpState.prog=`Explaining paper ${k+1} of ${todo.length}: ${p.t}`; render();
      const data=await sample.json(xprompt(p),{signal:cmpState.ctl.signal, modelTier:'default'});
      const o=normX(data); if(!o) throw {code:'invalid_json'};
      o.at=new Date().toISOString().slice(0,10); xput(p.i,o);
    }
  }catch(e){ cmpState.msg=XERR[e&&e.code]||'Claude could not finish. Try again.'; }
  cmpState.busy=false; cmpState.prog=''; render();
}

function cmpPrompt(ps){
  return `You are helping a PhD student write ${DSUB}.

Compare these ${ps.length} papers side by side.

${ps.map((p,i)=>{ const x=xget(p.i); return `PAPER ${i+1}
Title: ${p.t}
arXiv: ${p.i}   Date: ${p.d}   Venue: ${p.v.join(', ')||'preprint'}
Abstract: ${p.ab||'(none)'}${x?`\nMethod notes: ${x.key_idea} Pipeline: ${x.stages.map(s=>s.label).join(' -> ')}. Training: ${x.training}${x.ex?' Experiments: '+Object.keys(EXL).map(k=>EXL[k]+': '+exText(x.ex[k])).join('; '):''}`:''}`; }).join('\n\n')}

RULES
- Base everything on the abstracts and method notes above, plus your knowledge only if you clearly recognise a paper.
- Never invent numbers. Quote numbers only if they appear above; otherwise describe qualitatively, or write "not stated".
- Choose 8 to 12 comparison dimensions that actually separate these papers. Always include: "Input / setting", ${DESK.compareDims||'"3D representation", "Core technical idea", "Supervision and losses", "Optimization: per-scene or feed-forward", "Speed / efficiency", "Output and quality focus"'}. Add others that fit (${DESK.compareExtra||'e.g. "Camera poses required", "Handles dynamics", "Geometry / mesh quality", "Memory / storage"'}). Datasets, baselines, GPUs, training time and ${DESK.viewsLabel?esc(DESK.viewsLabel).toLowerCase():'view counts'} are already shown in separate rows, so do not repeat them as dimensions; but do use them in key_differences.
- Each value is a short phrase (max ~18 words).

Reply with ONLY one JSON object in exactly this shape:
{
 "summary": "3-4 sentences on how these papers relate and differ",
 "dimensions": [{"name":"Input / setting","values":["one value per paper, in paper order"]}],
 "shared": ["2-4 things they have in common"],
 "key_differences": ["3-5 sharp differences, naming papers as P1, P2, ..."],
 "choose_when": ["one sentence per paper, in order: when you would pick this method"],
 "survey_grouping": "2-3 sentences: how to present these papers together in a survey section (taxonomy / storyline)"
}`;
}
function normCmp(d,n){
  if(!d||typeof d!=='object'||!Array.isArray(d.dimensions)) return null;
  const arr=a=>Array.isArray(a)?a.map(String):[];
  const dims=d.dimensions.filter(x=>x&&x.name).map(x=>({name:String(x.name),values:Array.from({length:n},(_,i)=>String((x.values||[])[i]??'—'))}));
  if(!dims.length) return null;
  return {summary:String(d.summary||''),dims,shared:arr(d.shared),diffs:arr(d.key_differences),choose:arr(d.choose_when),grouping:String(d.survey_grouping||''),at:new Date().toISOString().slice(0,10)};
}
async function runCompare(){
  const sample=await getSample();
  if(!sample){ cmpState.msg='Claude is only available when this page is opened on claude.ai.'; render(); return; }
  const ps=cmp.map(findPaper).filter(Boolean);
  cmpState.busy=true; cmpState.ctl=new AbortController(); cmpState.msg=''; cmpState.prog='Comparing the papers. This takes about 30–90 seconds.'; render();
  try{
    const data=await sample.json(cmpPrompt(ps),{signal:cmpState.ctl.signal, modelTier:'default', onText:({text})=>{ const g=$('#cmp-prog'); if(g) g.textContent=`Writing the comparison… ${text.length.toLocaleString()} characters so far`; }});
    const o=normCmp(data,ps.length); if(!o) throw {code:'invalid_json'};
    cmpPut(o);
  }catch(e){ cmpState.msg=XERR[e&&e.code]||'Claude could not finish. Try again.'; }
  cmpState.busy=false; cmpState.prog=''; render();
}
function cmpMarkdown(ps,o){
  const cell=s=>String(s).replace(/\|/g,'\\|').replace(/\n/g,' ');
  const head='| Dimension | '+ps.map((p,i)=>`P${i+1}: ${cell(p.t)}`).join(' | ')+' |';
  const sep='|---|'+ps.map(()=>'---').join('|')+'|';
  const rows=[['Venue / date',...ps.map(p=>(p.v.join(', ')||'arXiv')+' · '+p.d)],['arXiv',...ps.map(p=>p.i)]];
  if(o) o.dims.forEach(d=>rows.push([d.name,...d.values]));
  if(o && ps.some(p=>xget(p.i))) Object.keys(EXL).forEach(k=>rows.push([EXL[k],...ps.map(p=>{const x=xget(p.i);return x?exText(x.ex&&x.ex[k]):'—';})]));
  else ps.map(p=>xget(p.i)).some(Boolean) && [['TL;DR',x=>x.tldr],['Key idea',x=>x.key_idea],['Pipeline',x=>x.stages.map(s=>s.label).join(' → ')],['Training',x=>x.training],...Object.keys(EXL).map(k=>[EXL[k],x=>exText(x.ex&&x.ex[k])])].forEach(([n,f])=>rows.push([n,...ps.map(p=>{const x=xget(p.i);return x?f(x):'—';})]));
  return [head,sep,...rows.map(r=>'| '+r.map(cell).join(' | ')+' |')].join('\n')+(o&&o.summary?'\n\n'+o.summary:'');
}

function bindCompare(){
  const m=$('#main');

const BDAYS=[]; BW.forEach((w,wi)=>w.d.forEach(d=>BDAYS.push({w:wi,m:w.m,d})));
let bdone=new Set(), bstart='';
try{ bdone=new Set(JSON.parse(localStorage.getItem(SP+'blender')||'[]')); bstart=localStorage.getItem(SP+'blender-start')||''; }catch(e){}
const bst={hide:false};
function bsave(){ try{ localStorage.setItem(SP+'blender',JSON.stringify([...bdone])); localStorage.setItem(SP+'blender-start',bstart); }catch(e){} }
function todayIndex(){ if(!bstart) return -1; const s=new Date(bstart+'T00:00:00'), n=new Date(); n.setHours(0,0,0,0); return Math.floor((n-s)/86400000); }
const MONTHS={1:['Month 1','Blender foundations: interface, modeling, materials, lighting, rendering'],2:['Month 2','Intermediate skills: sculpting, UVs, Geometry Nodes, animation, compositing'],3:['Month 3','Blender for 3D vision research: Python, camera poses, synthetic datasets, splats and meshes, survey figures']};
function viewBlender(){
  const total=BDAYS.length, fin=BDAYS.filter((_,i)=>bdone.has(i)).length, pct=Math.round(100*fin/total);
  const ti=todayIndex(); const next=BDAYS.findIndex((_,i)=>!bdone.has(i));
  const q=st.q.trim().toLowerCase();
  let gi=0, html='';
  [1,2,3].forEach(m=>{
    html+=`<section class="sec"><div class="lhead"><span class="lnum">${MONTHS[m][0]}</span><h2>${esc(MONTHS[m][1])}</h2></div>`;
    BW.forEach((w,wi)=>{ if(w.m!==m) return;
      const startIdx=BDAYS.findIndex(x=>x.w===wi);
      const rows=w.d.map((d,k)=>{ const i=startIdx+k; return {i,d}; })
        .filter(({i,d})=>(!bst.hide||!bdone.has(i)) && (!q || d.join(' ').toLowerCase().includes(q)));
      const wdone=w.d.filter((_,k)=>bdone.has(startIdx+k)).length;
      if(!rows.length) return;
      html+=`<div class="bweek"><div class="bwh"><b>Week ${wi+1} · ${esc(w.w)}</b><span class="status">${wdone}/${w.d.length} days</span></div>
        ${rows.map(({i,d})=>{ const r=d[3]&&BR[d[3]]; const isT=i===ti, isN=i===next;
          return `<div class="bday${bdone.has(i)?' isdone':''}${isT?' today':''}" id="bday-${i}">
            <label class="ldone"><input type="checkbox" data-bday="${i}" ${bdone.has(i)?'checked':''} aria-label="Mark day ${i+1} done"></label>
            <div class="bdn">Day ${i+1}${isT?'<span class="chip new">Today</span>':isN&&ti<0?'<span class="chip new">Next</span>':''}</div>
            <div style="min-width:0"><b>${esc(d[0])}</b><p>${esc(d[1])}</p>
              <div class="bmeta">${d[2]?`<span><span class="bk">Done when</span> ${esc(d[2])}</span>`:''}${r?`<a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])} ↗</a>`:''}</div></div></div>`; }).join('')}</div>`;
    });
    html+='</section>';
  });
  return `<section class="panel live"><h2>Blender in 90 days, from zero</h2>
    <p>About 1–2 hours a day. Month 1 builds the foundations, Month 2 adds intermediate skills, and Month 3 turns Blender into a research tool for your survey: scripted camera rigs, NeRF-style synthetic datasets, importing Gaussian splats and meshes, and figures and videos. Most weeks end with a practice day and a review day, and each month ends with a small project. Progress stays in this browser.</p>
    <div class="row"><label for="bstart" class="status">Start date</label><input type="date" id="bstart" value="${esc(bstart)}" style="width:auto">
      ${ti>=0?`<span class="status">${ti<total?`Today is day ${ti+1}`:'Plan period finished'}</span>`:''}
      <label class="check"><input type="checkbox" id="bhide" ${bst.hide?'checked':''}> Hide finished days</label>
      ${(ti>=0&&ti<total)||next>=0?`<button class="btn" id="bjump">Go to ${ti>=0&&ti<total?'today':'next day'}</button>`:''}</div>
    <div class="lprog"><div class="lbar"><span style="width:${pct}%"></span></div><span class="status">${fin} of ${total} days done</span></div>
    <div class="bres">${Object.values(BR).slice(0,8).map(r=>`<a class="vbtn" href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])} ↗</a>`).join('')}</div>
    <p class="note">Video links open a YouTube search for that series, since channels move and rename playlists.</p></section>
    ${searchBar('Filter days, e.g. “camera”, “Geometry Nodes”, “splat”')}
    ${html||'<div class="empty">No days match.</div>'}`;
}
function bindBlender(){
  const s=$('#bstart'); if(s) s.onchange=()=>{ bstart=s.value; bsave(); render(); };
  const h=$('#bhide'); if(h) h.onchange=()=>{ bst.hide=h.checked; render(); };
  const j=$('#bjump'); if(j) j.onclick=()=>{ const ti=todayIndex(); const i=(ti>=0&&ti<BDAYS.length)?ti:BDAYS.findIndex((_,k)=>!bdone.has(k)); document.getElementById('bday-'+i)?.scrollIntoView({behavior:'smooth',block:'center'}); };
}
document.getElementById('main').addEventListener('change',e=>{
  const c=e.target.closest('[data-bday]'); if(!c) return;
  const i=+c.dataset.bday; c.checked?bdone.add(i):bdone.delete(i); bsave();
  const y=window.scrollY; render(); window.scrollTo(0,y);
});

const SUBNAV=v=>`<nav class="subnav"><a class="vbtn" href="#learn" aria-current="${v==='learn'?'page':'false'}">${esc(DESK.learnLabel||'3DGS learning path')}</a><a class="vbtn" href="#blender" aria-current="${v==='blender'?'page':'false'}">Blender 90-day plan</a></nav>`;
function render(){
  document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current', (a.dataset.v===st.view||(st.view==='blender'&&a.dataset.v==='learn'))?'page':'false'));
  renderTopics();
  const m=$('#main');
  if(st.view==='latest') m.innerHTML=viewLatest();
  else if(st.view==='venues') m.innerHTML=viewVenues();
  else if(st.view==='reading') m.innerHTML=viewReading();
  else if(st.view==='foundations') m.innerHTML=viewFoundations();
  else if(st.view==='learn') m.innerHTML=(DESK.noBlender?'':SUBNAV('learn'))+viewLearn();
  else if(st.view==='blender'){ m.innerHTML=SUBNAV('blender')+viewBlender(); bindBlender(); }
  else if(st.view==='compare'){ m.innerHTML=viewCompare(); bindCompare(); }
  else m.innerHTML=viewSearchOut();
  if($('#results')) renderList();
  const q=$('#q'); if(q){
    if(st.view==='foundations'||st.view==='search-out'||st.view==='learn'||st.view==='blender'){ q.addEventListener('change',()=>{st.q=q.value; render();}); q.addEventListener('keydown',e=>{if(e.key==='Enter'){st.q=q.value; render();}}); }
    else bindSearch();
  }
  m.querySelectorAll('[data-term]').forEach(b=>b.addEventListener('click',()=>{st.q=b.dataset.term; render();}));
  const gl=$('#golive'); if(gl) gl.addEventListener('click',fetchLive);
  if(st.live && $('#livelist')) finishLive(st.live, st.liveSrc);
  const ca=$('#copyall'); if(ca) ca.addEventListener('click',()=>copy(P.filter(p=>reading.has(p.i)).map(bib).join('\n\n'),'BibTeX for '+reading.size+' papers copied'));
  setupSave();
  updateTray(); document.body.classList.toggle('has-tray',!tray.hidden); $('#cn').textContent=cmp.length;
  renderFreshNote();
}
function setupSave(){
  const b=$('#savecopy'); if(!b||!window.claude) return;
  window.claude.use('downloads').then(dl=>{
    if(!dl) return; b.hidden=false;
    b.onclick=async()=>{ try{ await dl.save({filename:(DESK.fileName||'splat-survey-desk.html'), data:ORIGINAL_HTML}); toast('Saved. Open it in Chrome or Firefox for live arXiv fetches.'); }
      catch(e){ if(e&&e.code==='declined') return; toast('Saving is not available here'); b.hidden=true; } };
  }).catch(()=>{});
}
function route(){ const h=location.hash.slice(1); st.view=['latest','venues','foundations','search-out','compare','learn','blender','reading'].includes(h)&&!(h==='blender'&&DESK.noBlender)?h:'latest'; st.shown=40; if(st.view!=='latest') st.live=null; render(); }
window.addEventListener('hashchange',route);

// stats
const acc=P.filter(p=>p.v.length).length;
$('#stats').innerHTML=`<span><b>${P.length.toLocaleString()}</b>arXiv papers</span><span><b>${acc.toLocaleString()}</b>accepted</span><span><b>${esc(latestD)}</b>newest</span>`;
$('#srcnote').innerHTML=DESK.srcNote?esc(DESK.srcNote):`Snapshot ${esc(SNAPSHOT)}. Merged from community-maintained Gaussian splatting paper lists and a daily arXiv tracker. Topic tags are assigned by keyword rules, so check borderline papers.`;
saveRL(); route(); loadFresh();
})();
